<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel do barbeiro — Bom Jesus</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="container" style="max-width:900px;padding:48px 20px">
  <section id="login" class="modal-box" style="margin:auto;max-width:420px"><h1>Painel do barbeiro</h1><p class="section-sub">Entre para consultar sua agenda.</p><form id="login-form"><label class="field"><span>Telefone</span><input name="phone" type="tel" required placeholder="55999939207"></label><label class="field"><span>Senha</span><input name="password" type="password" required></label><p id="login-error" class="error-text"></p><button class="btn btn-primary" type="submit">Entrar</button></form></section>
  <section id="dashboard" hidden><div class="section-head"><div><h1>Minha agenda</h1><p id="barber-name" class="section-sub"></p></div><button id="logout" class="btn btn-ghost">Sair</button></div><div id="agenda-list" class="appointments"></div></section>
</main><script type="module" src="js/barber.js"></script></body></html>
